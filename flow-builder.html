<style>
:root{
  --bg:#F2F4F7; --canvas:#F7F8FA; --dot:#D3D9E2; --layer:#FFFFFF; --layer2:#EEF1F5; --ink:#161B24; --muted:#5B6574; --line:#C9D1DC; --line2:#E1E6ED;
  --accent:#1F5FD1; --accent-ink:#FFFFFF; --focus:#1F5FD1; --gold:#B8971F;
  --g-GOV:#51607A; --g-INV:#11788A; --g-ASS:#A5661A; --g-DEC:#7A45A0; --g-OPS:#2E7D48; --g-AIMS:#4A6893; --g-AGT:#9A7610; --g-SUP:#6F7786; --g-START:#161B24; --g-DECIDE:#B8971F; --g-END:#122C47; --e-branch:#B8971F;
  --e-route:#4A5567; --e-feeds:#3F6FA8; --e-decision:#7A45A0; --e-event:#7A45A0; --e-trigger:#B7791F; --e-monitor:#2E7D48; --e-escalate:#C0392B;
  --crit:#C0392B; --crit-bg:#FBE9E7; --high:#A5661A; --high-bg:#FBF0E0; --med:#4A6893; --med-bg:#E6EDF7;
  --sans:"IBM Plex Sans",Arial,"Helvetica Neue",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}

  --bg:#121212; --canvas:#171717; --dot:#2C2F35; --layer:#222428; --layer2:#2A2D32; --ink:#F1F3F6; --muted:#A3ABB7; --line:#3B3F46; --line2:#2E3137;
  --accent:#6EA2FF; --accent-ink:#0B1426; --focus:#6EA2FF; --gold:#E0C050;
  --g-GOV:#A4B3CC; --g-INV:#4FC1D3; --g-ASS:#E7A45A; --g-DEC:#C49BE3; --g-OPS:#71C58B; --g-AIMS:#93B0DA; --g-AGT:#E2C24F; --g-SUP:#AEB5C1; --g-START:#F1F3F6; --g-DECIDE:#E0C050; --g-END:#9FB0C6; --e-branch:#E0C050;
  --e-route:#9AA3B1; --e-feeds:#7FA8E0; --e-decision:#C49BE3; --e-event:#C49BE3; --e-trigger:#EBAA4A; --e-monitor:#71C58B; --e-escalate:#F07B6C;

:root[data-theme="dark"]{color-scheme:dark;
  --bg:#121212; --canvas:#171717; --dot:#2C2F35; --layer:#222428; --layer2:#2A2D32; --ink:#F1F3F6; --muted:#A3ABB7; --line:#3B3F46; --line2:#2E3137;
  --accent:#6EA2FF; --accent-ink:#0B1426; --focus:#6EA2FF; --gold:#E0C050;
  --g-GOV:#A4B3CC; --g-INV:#4FC1D3; --g-ASS:#E7A45A; --g-DEC:#C49BE3; --g-OPS:#71C58B; --g-AIMS:#93B0DA; --g-AGT:#E2C24F; --g-SUP:#AEB5C1; --g-START:#F1F3F6; --g-DECIDE:#E0C050; --g-END:#9FB0C6; --e-branch:#E0C050;
  --e-route:#9AA3B1; --e-feeds:#7FA8E0; --e-decision:#C49BE3; --e-event:#C49BE3; --e-trigger:#EBAA4A; --e-monitor:#71C58B; --e-escalate:#F07B6C;
  --crit:#F07B6C; --crit-bg:#3B1D1A; --high:#EBAA4A; --high-bg:#35270F; --med:#93B0DA; --med-bg:#1C2738;}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;display:flex;flex-direction:column}
button,select,input{font-family:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.appbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--layer);border-bottom:1px solid var(--line);flex-wrap:wrap}
.appbar h1{margin:0;font-size:16px;font-weight:600;letter-spacing:.005em}
.appbar .crumb{font:500 12px var(--mono);color:var(--muted)}
.appbar .sp{flex:1}
.tool{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 16px;background:var(--layer);border-bottom:1px solid var(--line)}
.tool label{font-size:12px;color:var(--muted)}
.tool select,.tool input{height:32px;border:1px solid var(--line);border-bottom:1px solid var(--muted);background:var(--layer2);color:var(--ink);padding:0 10px;font-size:13px;border-radius:0}
.tool input{width:200px;max-width:100%}
.tool select{max-width:100%}
.btn{height:32px;padding:0 12px;border:1px solid var(--line);background:var(--layer);color:var(--ink);font-size:13px;cursor:pointer;border-radius:0;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--layer2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.icon{width:32px;justify-content:center;padding:0;font-size:16px}
.divider{width:1px;height:22px;background:var(--line)}

.main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:0}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr);grid-template-rows:62vh auto}}
.canvas{position:relative;overflow:auto;background-color:var(--canvas);background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:20px 20px;min-height:360px}
.stage{position:relative;transform-origin:0 0}
svg.wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.wire{fill:none;stroke-width:1.6}
.wire.dash{stroke-dasharray:6 4}
.pill{position:absolute;transform:translateY(-50%);font:500 10.5px var(--sans);background:var(--layer);border:1px solid var(--line);color:var(--muted);padding:1px 7px;white-space:nowrap;max-width:128px;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.pill.cond{color:var(--high);border-color:var(--high)}

.nd{position:absolute;width:236px;height:68px;background:var(--layer);border:1px solid var(--line);display:grid;grid-template-columns:40px 1fr 30px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.nd:hover{border-color:var(--muted)}
.nd.sel{border:2px solid var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.nd .tile{display:grid;place-items:center;font:600 10px var(--mono);letter-spacing:.03em;color:#fff}
.nd .body{padding:7px 8px 6px 10px;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:1px}
.nd .nid{font:600 10.5px var(--mono);color:var(--muted);display:flex;gap:6px;align-items:center}
.nd .t{font-size:12.5px;font-weight:500;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nd .exp{border:0;border-left:1px solid var(--line2);background:transparent;color:var(--muted);font:600 12px var(--mono);cursor:pointer;display:grid;place-items:center;padding:0}
.nd .exp:hover{background:var(--layer2);color:var(--ink)}
.nd .exp[disabled]{cursor:default;opacity:.35}
.nd.loop{border-style:dashed;opacity:.85}
.nd.loop .t{color:var(--muted)}
.nd .dot{width:7px;height:7px;border-radius:50%}
.nd.start{border-color:var(--ink)}
.nd.new{animation:pop .22s ease-out}
@keyframes pop{from{opacity:.2;transform:translateX(-10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.nd.new{animation:none}}

aside.props{background:var(--layer);border-left:1px solid var(--line);overflow:auto;padding:16px 18px 24px}
@media (max-width:900px){aside.props{border-left:0;border-top:1px solid var(--line)}}
.props .eyebrow{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.props h2{margin:2px 0 6px;font-size:18px;font-weight:600;text-wrap:balance}
.props p{margin:0 0 10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px;margin:10px 0 4px;padding:10px 0;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.sec{margin-top:16px}
.sec h3{margin:0 0 6px;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.why{background:var(--layer2);padding:8px 10px;font-size:13px}
.why .c{color:var(--high);font-weight:500}
.next{display:grid;gap:6px}
.nx{display:grid;grid-template-columns:4px 1fr auto;gap:0 10px;align-items:center;border:1px solid var(--line2);background:var(--layer);padding:0}
.nx .bar{align-self:stretch}
.nx .tx{padding:7px 0;font-size:12.5px;min-width:0}
.nx .tx b{font:600 11px var(--mono)}
.nx .tx .c{display:inline-block;margin-left:6px;font-size:11px;color:var(--high);background:var(--high-bg);padding:0 5px}
.nx .tx .l{color:var(--muted);display:block}
.nx button{margin-right:6px;height:28px;font-size:12px}
.rel{display:flex;flex-wrap:wrap;gap:4px}
.rel button{font:500 11px var(--mono);border:1px solid var(--line);background:transparent;color:var(--ink);padding:2px 6px;cursor:pointer}
.iss{padding:7px 10px;font-size:12.5px;margin-top:5px}
.iss.crit{background:var(--crit-bg)} .iss.high{background:var(--high-bg)} .iss.med{background:var(--med-bg)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;gap:5px;align-items:center}
.note{font-size:12px;color:var(--muted)}
.sibs{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;margin:10px 0 0}.sibs a{color:#C8AB36;text-decoration:none;border-bottom:1px solid rgba(200,171,54,.45)}.sibs a:hover{border-bottom-color:#C8AB36}.sibs span{color:rgba(255,255,255,.6)}
.appbar .sibs{margin:0}.appbar .sibs span{color:var(--muted)}.appbar .sibs a{color:var(--ink);border-bottom-color:#C8AB36}
.docbox{margin:12px 0 4px}.docbtn{text-decoration:none;height:auto;padding:8px 12px;display:inline-flex;flex-direction:column;align-items:flex-start;gap:1px;font-weight:500}.docmeta{font:500 11px var(--mono);opacity:.85}
.nd.decide{border-color:var(--g-DECIDE)}.nd.end{border-color:var(--g-END);border-width:2px}
.nd .tile .dia{display:block;width:14px;height:14px;background:#122C47;transform:rotate(45deg)}
.pill.ans{max-width:190px;color:#6B5510;border-color:var(--g-DECIDE);background:#FBF6E4;font-weight:600}
:root[data-theme="dark"] .pill.ans{color:#1a1a1a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.ans{color:#2a2200;background:#E0C050}}
/* Role chips (pilot) */
.nd .rcs{display:inline-flex;gap:3px;margin-left:auto;flex-wrap:nowrap;overflow:hidden}
.rc{font:600 9.5px var(--mono);letter-spacing:.02em;padding:0 4px;border:1px solid var(--line);color:var(--ink);background:var(--layer2);white-space:nowrap;line-height:14px}
.rc.me{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.rc .qm{font-weight:700;margin-left:3px}
.rc.pilot{border-style:dashed}
.nd.mine{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.nd.mine.sel{border-color:var(--accent)}
.nd.faded{opacity:.45}
.nd.faded:hover,.nd.faded.sel{opacity:1}
.pnote{font:600 10.5px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--high);background:var(--high-bg);padding:3px 7px}
.rstat{font-size:12.5px;padding:7px 10px;margin:8px 0 2px}
.rstat.clear{background:var(--layer2)} .rstat.pilot{background:var(--high-bg)} .rstat.conflict{background:var(--crit-bg)} .rstat.flow{background:var(--layer2)}
.kv .q{color:var(--muted)}
.kv mark{background:color-mix(in srgb,var(--accent) 22%,transparent);color:inherit;padding:0 2px}
.cfl{font-size:12.5px;margin-top:6px}
</style>

const REPL=new Set();DECISIONS.forEach(d=>d.branches.forEach(b=>{if(b.replaces)REPL.add(d.from+">"+b.replaces)}));
const DEDGES=[];DECISIONS.forEach(d=>{DEDGES.push([d.from,d.id,"route","Decide: "+d.q,""]);d.branches.forEach(b=>DEDGES.push([d.id,b.to,"branch",b.why,"",b.label]))});
const all=[...EDGES,...EXTRA].filter(e=>!(REPL.has(e[0]+">"+e[1])&&["route","trigger","feeds","escalate","decision"].includes(e[2]))).concat(DEDGES).map(e=>({from:e[0],to:e[1],type:e[2],label:e[3],cond:e[4],pill:e[5]||""}));
const flow=all.filter(e=>TYPES[e.type]);
const outs=id=>flow.filter(e=>e.from===id).sort((a,b)=>ORDER.indexOf(a.type)-ORDER.indexOf(b.type));
const short=id=>id.startsWith("START")?"START":id.startsWith("D-")?"DECISION":id.startsWith("END-")?"END":id==="UCV"?"UC-VIEW":id.replace("AIG-","");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// ---- roles (pilot)
const RD=Object.assign({},ROLEDATA.ROLES), RDEF=ROLEDATA.ROLEDEF, RCONF=ROLEDATA.CONF;
// start, decision and end points: taken from each point's existing "who" text
const F=(does,con,dec)=>({does,con,dec,st:"flow"});
Object.assign(RD,{
 "START-NEW":F([["STAFF","proposes the use"]],[],[]),
 "START-FOUND":F([["STAFF","whoever discovers it discloses it"]],[],[]),
 "START-CHANGE":F([["SO","reports the change"]],[],[]),
 "D-FASTTRACK":F([],[["SO","screening answers"]],[["GL","validates the route only, not approval"]]),
 "D-CANACT":F([],[["SO","intake answers"]],[["GL","classification and route"]]),
 "D-TIER":F([],[],[["GL","confirms the route; not approval"]]),
 "D-APPROVED":F([],[["BOARD","assurance, not approval"]],[["DM","Medium and above"],["SO","Low tier, with Service Manager"]]),
 "D-BREACH":F([["SO","checks results against thresholds"],["GL","portfolio view"]],[],[]),
 "D-INCIDENT":F([],[["GL",""],["SO",""]],[["DM","competent delegated authority"]]),
 "END-LIGHT":F([["SO","holds the use"]],[],[]),
 "END-LIVE":F([["SO","runs monitoring"]],[],[]),
 "END-STOPPED":F([],[],[["DM","decision-making body"]]),
 "END-RETIRED":F([["SO","withdraws the service"]],[],[]),
});
const SPEC=new Set(["DPO","EQ","LEG","SEC","PROC","IA","CAP","TECH"]);
const SHORT={SO:"SO",GL:"GL",DPO:"DPO",EQ:"Equal.",LEG:"Legal",SEC:"Security",PROC:"Procure",IA:"Audit",CAP:"Map owner",TECH:"Tech",BOARD:"Board",DM:"DM",TOP:"SLT",STAFF:"Staff"};
const TOOLROLES=[["SO","Service Owner"],["GL","AI Governance Lead"],["BOARD","AI Assurance Board"],["DM","Delegated decision-maker"],["TOP","Senior leadership"],["STAFF","All staff"]];
const SPECROLES=[["SPEC","All specialists"],["DPO","Data Protection Officer"],["EQ","Equalities lead"],["LEG","Legal Services"],["SEC","Information / Cyber Security"],["PROC","Procurement"],["IA","Internal Audit"],["CAP","Capability / map owner"],["TECH","Technical / platform owner (proposed)"]];
const roleName=c=>c==="SPEC"?"Specialists":(RDEF[c]||c)+(c==="TECH"?" (proposed)":"");
const hit=(c,r)=>c===r||(r==="SPEC"&&SPEC.has(c));
function relOf(id,r){const d=RD[id];if(!d||!r)return null;const o={does:d.does.some(x=>hit(x[0],r)),dec:d.dec.some(x=>hit(x[0],r)),con:d.con.some(x=>hit(x[0],r))};return(o.does||o.dec||o.con)?o:null}
let role="";
function chips(id){
  const d=RD[id];if(!d)return "";
  const st=d.st,qm=st==="pilot"?'<span class="qm" title="Pilot position">?</span>':st==="conflict"?'<span class="qm" title="Documents disagree">!</span>':"";
  const cls="rc"+(st==="pilot"||st==="conflict"?" pilot":"");
  if(role){const o=relOf(id,role);if(!o)return "";const t=[o.does&&"Does",o.dec&&"Decides"].filter(Boolean).join(" · ")||"Contributes";return `<span class="rcs"><span class="${cls} me" title="${esc(roleName(role))}: ${t.toLowerCase()}">${t}${qm}</span></span>`}
  const lead=d.does.length?d.does:d.dec;const seen=[...new Set(lead.map(x=>x[0]))];if(!seen.length)return "";
  return `<span class="rcs">${seen.slice(0,2).map((c,i)=>`<span class="${cls}" title="${d.does.length?"Does":"Decides"}: ${esc(roleName(c))}">${SHORT[c]||c}${i===0?qm:""}</span>`).join("")}${seen.length>2?`<span class="rc" title="${seen.slice(2).map(roleName).join(", ")}">+${seen.length-2}</span>`:""}</span>`;
}
function roleRows(id,info){
  const d=RD[id];if(!d)return `<dl class="kv"><dt>Who does it</dt><dd>${esc(info.owner)}</dd><dt>Stage</dt><dd>${esc(info.stage)}</dd><dt>Playbook</dt><dd>${esc(info.ref)}</dd><dt>Type</dt><dd>${esc(info.cls)}</dd></dl>`;
  const nm=x=>{const n=esc(roleName(x[0]));return (role&&hit(x[0],role)?`<mark>${n}</mark>`:n)+(x[1]?` <span class="q">(${esc(x[1])})</span>`:"")};
  const L=(a,empty)=>a.length?a.map(nm).join("<br>"):`<span class="q">${empty}</span>`;
  const stat={clear:"Roles from the suite's own text. Pilot: not yet confirmed by the council.",pilot:"Pilot position. The suite doesn't say, so this is a proposal to test.",conflict:"Pilot position. The documents disagree; this needs a decision before it's settled.",flow:"Roles as this step already describes them. Pilot: not yet confirmed by the council."}[d.st];
  const cf=(d.cf||[]).map(n=>`<div class="cfl"><b>Conflict ${n}:</b> ${esc(RCONF[n].t)}</div>`).join("");
  return `<div class="rstat ${d.st}">${stat}</div><dl class="kv"><dt>Does</dt><dd>${L(d.does,"No one here")}</dd><dt>Contributes</dt><dd>${L(d.con,"None named")}</dd><dt>Decides</dt><dd>${L(d.dec,"Nothing is decided here")}</dd>${info.g!=="START"&&info.g!=="DECIDE"&&info.g!=="END"?`<dt>Document owner</dt><dd>${esc(info.owner)}</dd>`:""}<dt>Stage</dt><dd>${esc(info.stage)}</dd><dt>Playbook</dt><dd>${esc(info.ref)}</dd><dt>Type</dt><dd>${esc(info.cls)}</dd></dl>${cf}${d.ask?`<div class="cfl"><b>Ask:</b> ${esc(d.ask)}</div>`:""}`;
}
const nodeIssues={};const addI=(id,sev,t)=>{(nodeIssues[id]=nodeIssues[id]||[]).push({sev,t})};

FINDINGS.num.forEach(r=>addI(r[0],r[0]==="AIG-OPS-02"?"crit":"high",`Reads “${r[1]}”, likely meant “${r[2]}”.`));
Object.entries(FINDINGS.stale).forEach(([f,a])=>addI(f,"med","Old-number references: "+a.join(", ")+"."));
FINDINGS.range.forEach(r=>addI(r[0],"med",`Old-sequence range “${r[1]}”.`));

// ---- tree state
let uid=0,root=null,sel=null,zoom=1;
function mk(id,parent,edge){const n={k:++uid,id,parent,edge,expanded:false,kids:null};
  let a=parent;n.loop=false;while(a){if(a.id===id){n.loop=true;break}a=a.parent}return n}
function kidsOf(n){if(n.loop)return[];if(!n.kids)n.kids=outs(n.id).map(e=>mk(e.to,n,e));return n.kids}
function setRoot(id){uid=0;root=mk(id,null,null);root.expanded=true;kidsOf(root);sel=root;render(true)}

// ---- layout
const CW=384,RH=90,NW=236,NH=68,PAD=40;
let cursor=0;
function layout(n,d){n.d=d;const ks=n.expanded?kidsOf(n):[];
  if(ks.length){ks.forEach(k=>layout(k,d+1));n.y=(ks[0].y+ks[ks.length-1].y)/2}else{n.y=cursor++*RH}}
function visible(n,acc=[]){acc.push(n);if(n.expanded)kidsOf(n).forEach(k=>visible(k,acc));return acc}

const stage=document.getElementById("stage"),wires=document.getElementById("wires"),canvas=document.getElementById("canvas");
let prevKeys=new Set();
function render(scrollToSel){
  cursor=0;layout(root,0);
  const vis=visible(root);
  const W=PAD*2+(Math.max(...vis.map(n=>n.d))+1)*CW, H=PAD*2+cursor*RH;
  stage.style.width=W+"px";stage.style.height=H+"px";stage.style.zoom=zoom;
  stage.parentElement;
  const holder=stage;[...holder.querySelectorAll(".nd,.pill")].forEach(e=>e.remove());
  wires.setAttribute("width",W);wires.setAttribute("height",H);wires.innerHTML="";
  const NSs="http://www.w3.org/2000/svg";
  const newKeys=new Set();
  vis.forEach(n=>{
    const x=PAD+n.d*CW,y=PAD+n.y;n.x=x;n.py=y;newKeys.add(n.k);
    const info=nodes[n.id];const ks=n.loop?[]:outs(n.id);
    const el=document.createElement("div");
    el.className="nd"+(n===sel?" sel":"")+(n.loop?" loop":"")+(info.g==="START"?" start":"")+(info.g==="DECIDE"?" decide":"")+(info.g==="END"?" end":"")+(prevKeys.has(n.k)?"":" new")+(role?(relOf(n.id,role)?" mine":" faded"):"");
    el.style.left=x+"px";el.style.top=y+"px";el.tabIndex=0;el.setAttribute("role","button");
    el.setAttribute("aria-label",`${info.id} ${info.title}`);
    const iss=nodeIssues[n.id];const worst=iss?(iss.some(i=>i.sev==="crit")?"crit":iss.some(i=>i.sev==="high")?"high":"med"):null;
    el.innerHTML=`<div class="tile" style="background:var(--g-${info.g})${["START","END"].includes(info.g)?";color:var(--layer)":""}${info.g==="DECIDE"?";color:#122C47":""}">${info.g==="START"?"▶":info.g==="DECIDE"?"<span class=dia></span>":info.g==="END"?"■":info.g}</div>
      <div class="body"><div class="nid">${esc(short(n.id))}${n.loop?" · loops back":""}${worst?`<span class="dot" style="background:var(--${worst})" title="Issue found in this file"></span>`:""}${chips(n.id)}</div><div class="t">${esc(info.title)}</div></div>
      <button class="exp" ${ks.length?"":"disabled"} aria-label="${n.expanded?"Collapse":"Open"} next steps">${ks.length?(n.expanded?"−":"+"+ks.length):"·"}</button>`;
    el.addEventListener("click",ev=>{if(ev.target.closest(".exp"))return;sel=n;if(!n.expanded&&ks.length){n.expanded=true}render();showProps(n)});
    el.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();sel=n;if(ks.length)n.expanded=!n.expanded;render();showProps(n)}});
    el.querySelector(".exp").addEventListener("click",ev=>{ev.stopPropagation();if(!ks.length)return;n.expanded=!n.expanded;sel=n;render();showProps(n)});
    holder.appendChild(el);
    if(n.parent){
      const p=n.parent,x1=p.x+NW,y1=p.py+NH/2,x2=x,y2=y+NH/2,mx=x1+22;
      const d=`M${x1},${y1} H${mx-8} Q${mx},${y1} ${mx},${y1+(y2>y1?8:y2<y1?-8:0)} V${y2+(y2>y1?-8:y2<y1?8:0)} Q${mx},${y2} ${mx+8},${y2} H${x2}`;
      const path=document.createElementNS(NSs,"path");path.setAttribute("d",Math.abs(y2-y1)<1?`M${x1},${y1} H${x2}`:d);
      path.setAttribute("class","wire"+(n.edge.type==="trigger"||n.edge.cond?" dash":""));path.style.stroke=`var(--e-${n.edge.type})`;wires.appendChild(path);
      const ar=document.createElementNS(NSs,"path");ar.setAttribute("d",`M${x2-7},${y2-4} L${x2},${y2} L${x2-7},${y2+4}`);ar.setAttribute("class","wire");ar.style.stroke=`var(--e-${n.edge.type})`;wires.appendChild(ar);
      const pill=document.createElement("div");pill.className="pill"+(n.edge.cond?" cond":"");
      pill.textContent=n.edge.pill||n.edge.cond||TYPES[n.edge.type];if(n.edge.pill)pill.classList.add("ans");pill.style.left=(mx+10)+"px";pill.style.top=(y2-13)+"px";holder.appendChild(pill);
    }
  });
  prevKeys=newKeys;
  if(scrollToSel&&sel){canvas.scrollTo({left:0,top:Math.max(0,(sel.py-120)*zoom),behavior:"smooth"})}
  else if(sel){const r={l:sel.x*zoom,t:sel.py*zoom};if(r.l+NW*zoom>canvas.scrollLeft+canvas.clientWidth||r.l<canvas.scrollLeft||r.t<canvas.scrollTop||r.t>canvas.scrollTop+canvas.clientHeight-80)canvas.scrollTo({left:Math.max(0,r.l-CW*zoom),top:Math.max(0,r.t-canvas.clientHeight/3),behavior:"smooth"})}
}

// ---- properties panel
const props=document.getElementById("props");
function showProps(n){
  const info=nodes[n.id];const ks=n.loop?[]:outs(n.id);
  const rel=all.filter(e=>!TYPES[e.type]&&(e.from===n.id||e.to===n.id)).map(e=>e.from===n.id?e.to:e.from);
  const inc=all.filter(e=>TYPES[e.type]&&e.to===n.id&&(!n.parent||e.from!==n.parent.id)).map(e=>e.from);
  const iss=nodeIssues[n.id]||[];
  props.innerHTML=`<div class="eyebrow" style="color:var(--g-${info.g})">${info.g==="START"?"Start point":info.g==="DECIDE"?"Decision point":info.g==="END"?"End point":esc(n.id)+" · "+GROUPS[info.g]}</div>
  <h2>${esc(info.title)}</h2><p>${esc(info.desc)}</p>
  ${n.edge?`<div class="why"><b>Why you're here:</b> ${n.edge.pill?`answer “${esc(n.edge.pill)}”. `:""}${esc(n.edge.label)}${n.edge.cond?` <span class="c">Only if: ${esc(n.edge.cond)}</span>`:""}</div>`:""}
  ${roleRows(n.id,info)}
  ${DOCS[n.id]?`<div class="docbox"><a class="btn primary docbtn" href="${DOCS[n.id].file}" target="_blank" rel="noopener">${DOCS[n.id].kind==="workbook"?"Open workbook summary":"Open document"}<span class="docmeta">PDF · ${DOCS[n.id].pages} page${DOCS[n.id].pages>1?"s":""}</span></a>${DOCS[n.id].kind==="workbook"?`<p class="note">Sheet and column headings only. Formulas, dropdowns and working rows are in the Excel file in the suite pack.</p>`:""}</div>`:""}
  ${n.loop?`<p class="note">This step already appears earlier on this path, so it isn't opened again here. Select it higher up to continue.</p>`:""}
  ${iss.length?`<div class="sec"><h3>Issues in this file</h3>${iss.map(i=>`<div class="iss ${i.sev}">${esc(i.t)}</div>`).join("")}</div>`:""}
  <div class="sec"><h3>What to do next${ks.length?` (${ks.length})`:""}</h3>${ks.length?`<div class="next">${ks.map((e,i)=>`<div class="nx"><span class="bar" style="background:var(--e-${e.type})"></span><div class="tx"><b>${esc(short(e.to))}</b> ${esc(nodes[e.to].title)}${e.cond?`<span class="c">${esc(e.cond)}</span>`:""}<span class="l">${e.pill?`If “${esc(e.pill)}”`:TYPES[e.type]}: ${esc(e.label)}</span></div><button class="btn" data-i="${i}">Go</button></div>`).join("")}</div>`:`<p class="note">${n.loop?"":"This is an end point on this path."}</p>`}</div>
  ${inc.length?`<div class="sec"><h3>Also reached from</h3><div class="rel">${[...new Set(inc)].map(id=>`<button data-root="${id}" title="${esc(nodes[id].title)}">${esc(id.startsWith("D-")?"◆ "+nodes[id].title:short(id))}</button>`).join("")}</div></div>`:""}
  ${rel.length?`<div class="sec"><h3>Reference links</h3><div class="rel">${[...new Set(rel)].map(id=>`<button data-root="${id}" title="${esc(nodes[id].title)}">${esc(short(id))}</button>`).join("")}</div><p class="note" style="margin-top:6px">Design principles, derived views and mappings. Select one to start a flow from it.</p></div>`:""}
  <div class="legend">${Object.entries(TYPES).map(([k,v])=>`<span><svg width="18" height="6"><line x1="0" y1="3" x2="18" y2="3" stroke-width="2" style="stroke:var(--e-${k})" ${k==="trigger"?'stroke-dasharray="4 3"':""}/></svg>${v}</span>`).join("")}</div>`;
  props.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{const k=kidsOf(n)[+b.dataset.i];n.expanded=true;sel=k;if(!k.loop&&outs(k.id).length)k.expanded=true;render();showProps(k)});
  props.querySelectorAll("[data-root]").forEach(b=>b.onclick=()=>{startSel.value=b.dataset.root;setRoot(b.dataset.root);showProps(root)});
}

// ---- toolbar
const startSel=document.getElementById("start");
const starts=[["START-NEW","A new AI use is proposed"],["START-FOUND","AI discovered already in use"],["START-CHANGE","A live system changes materially"]];
startSel.innerHTML=`<optgroup label="Scenarios">${starts.map(s=>`<option value="${s[0]}">${s[1]}</option>`).join("")}</optgroup><optgroup label="Or start from an artefact">${NODES.map(n=>`<option value="${n[0]}">${short(n[0])} · ${esc(n[1])}</option>`).join("")}</optgroup>`;
startSel.onchange=()=>{setRoot(startSel.value);showProps(root)};
document.getElementById("alist").innerHTML=NODES.map(n=>`<option value="${short(n[0])} · ${esc(n[1])}"></option>`).join("");
document.getElementById("find").addEventListener("change",ev=>{const v=ev.target.value.toLowerCase();const m=NODES.find(n=>(short(n[0])+" · "+n[1]).toLowerCase()===v||n[0].toLowerCase().includes(v.split(" ")[0])||n[1].toLowerCase().includes(v));if(m){startSel.value=m[0];setRoot(m[0]);showProps(root);ev.target.value=""}});
function expandN(n,depth){if(depth<=0||n.loop)return;if(outs(n.id).length){n.expanded=true;kidsOf(n).forEach(k=>expandN(k,depth-1))}}
document.getElementById("expandAll").onclick=()=>{const t=sel||root;expandN(t,2);render();showProps(t)};
document.getElementById("collapse").onclick=()=>{const t=sel||root;(function c(n){n.expanded=false;(n.kids||[]).forEach(c)})(t);if(t===root)root.expanded=true;render();showProps(t)};
const roleSel=document.getElementById("role");
roleSel.insertAdjacentHTML("beforeend",TOOLROLES.map(r=>`<option value="${r[0]}">${esc(r[1])}</option>`).join("")+`<optgroup label="Specialists">${SPECROLES.map(r=>`<option value="${r[0]}">${esc(r[1])}</option>`).join("")}</optgroup>`);
roleSel.onchange=()=>{role=roleSel.value;render();if(sel)showProps(sel)};
function setZoom(z){zoom=Math.max(.5,Math.min(1.4,z));document.getElementById("zreset").textContent=Math.round(zoom*100)+"%";render()}
document.getElementById("zin").onclick=()=>setZoom(zoom+.1);
document.getElementById("zout").onclick=()=>setZoom(zoom-.1);
document.getElementById("zreset").onclick=()=>setZoom(1);

// ---- initial: open the standard route a few steps
setRoot("START-NEW");
const path=["AIG-INV-01","AIG-INV-03","AIG-INV-04"];let cur=root;
path.forEach(id=>{cur.expanded=true;const k=kidsOf(cur).find(x=>x.id===id);if(k){cur=k}});
cur.expanded=true;sel=cur;render();showProps(cur);requestAnimationFrame(()=>canvas.scrollTo({left:0,top:Math.max(0,(sel.py-200)*zoom)}));
})();
</script>
